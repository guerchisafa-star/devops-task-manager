
apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskmanager-db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: taskmanager-db

  template:
    metadata:
      labels:
        app: taskmanager-db

    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "taskmanager"

            - name: POSTGRES_USER
              value: "postgres"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          emptyDir: {}
